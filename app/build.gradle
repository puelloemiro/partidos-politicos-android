plugins {
    id 'com.android.application'
}

android {
    namespace 'com.puelloemiro.partidos'
    compileSdk 34

    defaultConfig {
        applicationId "com.puelloemiro.partidos"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Librerías oficiales estándar de Android para soporte de UI y temas
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Pruebas unitarias con JUnit y soporte de org.json en entorno de pruebas local
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
